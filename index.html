<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10233f">
<title>GaragePro | ระบบจัดการอู่ซ่อมรถ</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="loginView" class="login-wrap"><div class="login-card"><div class="brand-mark">G<span>+</span></div><p class="eyebrow">GARAGE MANAGEMENT</p><h1>GaragePro</h1><p class="muted">ระบบจัดการอู่ซ่อมรถยนต์</p><form id="loginForm"><label>อีเมล<input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>รหัสผ่าน<input id="password" type="password" required autocomplete="current-password" placeholder="รหัสผ่าน"></label><button class="primary full" type="submit">เข้าสู่ระบบ</button><button id="showSignup" class="text-btn" type="button">ลงทะเบียนบัญชีใหม่</button></form><p id="loginMessage" class="notice"></p><p class="tiny">เริ่มต้นใช้งาน: ตั้งค่า Supabase ในไฟล์ <code>app.js</code> ก่อน</p></div></div>
<div id="appView" class="app hidden"><aside class="sidebar"><div class="brand"><div class="brand-mark small">G<span>+</span></div><div><b>GaragePro</b><small>WORKSHOP SYSTEM</small></div></div><div class="profile"><div class="avatar" id="avatar">G</div><div><b id="userName">ผู้ใช้งาน</b><small id="userRole">พนักงาน</small></div></div><nav id="nav"><button class="nav-item active" data-page="dashboard">▦ <span>ภาพรวม</span></button><button class="nav-item" data-page="customers">♙ <span>ลูกค้า</span></button><button class="nav-item" data-page="vehicles">▣ <span>รถยนต์</span></button><button class="nav-item" data-page="jobs">⚒ <span>ใบรับซ่อม</span></button><button class="nav-item" data-page="parts">◈ <span>อะไหล่</span></button><button class="nav-item" data-page="staff">♧ <span>ทีมงาน</span></button></nav><div class="side-bottom"><div class="connection"><i id="connectionDot"></i><span id="connectionText">ยังไม่เชื่อมต่อฐานข้อมูล</span></div><button id="logoutBtn" class="logout">↪ ออกจากระบบ</button></div></aside><main class="main"><header class="topbar"><button id="menuToggle" class="menu-toggle">☰</button><div><p class="eyebrow" id="dateLabel">WORKSHOP OVERVIEW</p><h2 id="pageTitle">ภาพรวมอู่ซ่อมรถ</h2></div><button id="quickAdd" class="primary">＋ เพิ่มรายการ</button></header><section id="pageContent" class="content"></section><footer>GaragePro <span>•</span> ระบบจัดการอู่ซ่อมรถ</footer></main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle">เพิ่มข้อมูล</h3><button id="modalClose" class="icon-btn" aria-label="ปิด">✕</button></div><form id="recordForm"><div id="formFields" class="form-grid"></div><div class="modal-actions"><button type="button" id="cancelModal" class="secondary">ยกเลิก</button><button type="submit" class="primary">บันทึกข้อมูล</button></div></form></div></div><div id="toast" class="toast"></div>
<script src="app.js"></script></body></html>
